read_registers:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: iwona_pellets
    start:
      required: true
      example: 10101
      selector:
        number:
          min: 1
          max: 65535
          mode: box
    count:
      required: true
      example: 4900
      selector:
        number:
          min: 1
          max: 5000
          mode: box
    include_zero:
      required: false
      default: false
      selector:
        boolean:
explore_menu:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: iwona_pellets
    keys:
      required: false
      example: '["menu", "ok"]'
      selector:
        object:
    delay:
      required: false
      default: 0.8
      selector:
        number:
          min: 0
          max: 5
          step: 0.1
          mode: box
          unit_of_measurement: s
    each:
      required: false
      default: false
      selector:
        boolean:
    labels:
      required: false
      selector:
        object:
    export_font:
      required: false
      default: false
      selector:
        boolean:
export_settings:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: iwona_pellets
